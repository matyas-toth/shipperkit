name: shipper
services:
  shipper:
    build: .
    image: shipper:local
    ports:
      - "127.0.0.1:${SHIPPER_PORT:-8080}:8080"
    environment:
      SHIPPER_PUBLIC_URL: "${SHIPPER_PUBLIC_URL:-}"
      SHIPPER_DASHBOARD_UPSTREAM: "${SHIPPER_DASHBOARD_UPSTREAM:-}"
      SHIPPER_PROXY_BIND: "${SHIPPER_PROXY_BIND:-127.0.0.1}"
      SHIPPER_HTTP_PORT: "${SHIPPER_HTTP_PORT:-8780}"
      SHIPPER_HTTPS_PORT: "${SHIPPER_HTTPS_PORT:-8743}"
      SHIPPER_ACME_EMAIL: "${SHIPPER_ACME_EMAIL:-}"
      SHIPPER_ACME_CA: "${SHIPPER_ACME_CA:-}"
    volumes:
      - shipper-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      io.shipper.control-plane: "true"
    restart: unless-stopped
volumes:
  shipper-data:

