name: shipper
services:
  shipper:
    build: .
    image: shipper:local
    ports:
      - "127.0.0.1:${SHIPPER_PORT:-8080}:8080"
    environment:
      SHIPPER_PUBLIC_URL: "${SHIPPER_PUBLIC_URL:-}"
    volumes:
      - shipper-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      io.shipper.control-plane: "true"
    restart: unless-stopped
volumes:
  shipper-data:

