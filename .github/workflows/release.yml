name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate the release version
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          version="${TAG#v}"
          package_version=$(node -p "require('./package.json').version")
          test "$version" = "$package_version" || { echo "package.json is $package_version, tag is $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Shipper
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: true
          sbom: true

      - name: Prepare install assets
        run: |
          set -euo pipefail
          printf 'ghcr.io/%s@%s\n' "$GITHUB_REPOSITORY" "${{ steps.build.outputs.digest }}" > image.txt
          printf '%s\n' "$VERSION" > version.txt
          printf 'https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" > release-url.txt
          sha256sum install.sh image.txt version.txt release-url.txt > SHA256SUMS
          test -s image.txt
          cat image.txt
          cat SHA256SUMS

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            :
          else
            args=(--verify-tag --title "$TAG" --generate-notes)
            [[ "$VERSION" == *-* ]] && args+=(--prerelease)
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" install.sh image.txt version.txt release-url.txt SHA256SUMS --clobber

      - name: Update the latest installer channel
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp install.sh image.txt version.txt release-url.txt SHA256SUMS "$tmp"/
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh image.txt version.txt release-url.txt SHA256SUMS
          git commit -qm "release: $TAG"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:latest
