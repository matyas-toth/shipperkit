name: Staging

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Resolve the nightly image
        run: |
          set -euo pipefail
          digest=$(gh api "repos/${GITHUB_REPOSITORY}/contents/image.txt?ref=nightly" --jq .content | base64 -d | tr -d '\n')
          [[ "$digest" =~ ^ghcr\.io/matyas-toth/shipperkit@sha256:[0-9a-f]{64}$ ]] || { echo "Invalid nightly image: $digest"; exit 1; }
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Install the staging candidate
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$STAGING_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_ed25519 install.sh "$STAGING_USER@$STAGING_HOST:/root/shipper-install.sh"
          ssh -i ~/.ssh/id_ed25519 "$STAGING_USER@$STAGING_HOST" \
            "bash /root/shipper-install.sh --image ${DIGEST}"
