name: Build a draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z or vX.Y.Z-rc.N)
        type: string
        required: true
permissions:
  contents: write
  packages: write
jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          test "$GITHUB_REPOSITORY" = "matyas-toth/shipperkit"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source and build the candidate
        run: |
          npm ci
          npm ci --prefix web
          npm run check
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          bash -n install.sh
          docker build --build-arg VERSION="${RELEASE_TAG#v}" -t shipper:release-check .
          test "$(docker run --rm --network none shipper:release-check version)" = "${RELEASE_TAG#v}"
          SHIPPER_TEST_IMAGE=shipper:release-check SHIPPER_TEST_PROTECTION_ONLY=1 npm run test:package
      - name: Publish the pinned image and prepare draft assets
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/matyas-toth/shipperkit
          docker tag shipper:release-check "$image:$RELEASE_TAG"
          docker push "$image:$RELEASE_TAG"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$RELEASE_TAG" |
            grep -E '^ghcr\.io/matyas-toth/shipperkit@sha256:[0-9a-f]{64}$' | head -1 > image.txt
          test -s image.txt
          sha256sum install.sh image.txt > SHA256SUMS
          gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes install.sh image.txt SHA256SUMS
