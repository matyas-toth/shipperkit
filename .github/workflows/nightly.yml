name: Nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: publish
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the nightly version
        run: |
          package_version=$(node -p "require('./package.json').version")
          echo "VERSION=${package_version}.nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the nightly image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:edge-${{ env.HEAD_SHA }}
            ghcr.io/${{ github.repository }}:nightly
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
          provenance: true
          sbom: true
      - name: Update the nightly channel
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > version.txt
          printf 'ghcr.io/%s@%s\n' "$GITHUB_REPOSITORY" "$DIGEST" > image.txt
          printf 'https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$HEAD_SHA" > release-url.txt
          sha256sum version.txt image.txt release-url.txt > SHA256SUMS
          tmp=$(mktemp -d)
          cp version.txt image.txt release-url.txt SHA256SUMS "$tmp"/
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt image.txt release-url.txt SHA256SUMS
          git commit -qm "nightly: $VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:nightly
