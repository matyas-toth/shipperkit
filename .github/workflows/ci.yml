name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            landing/package-lock.json
            cli/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm ci --prefix landing
      - run: npm ci --prefix cli
      - name: Typecheck and frontend unit tests
        run: |
          npm run check
          npm run check --prefix cli
          npm run test --prefix web
          npm test --prefix cli
      - name: Go vet and race tests
        env:
          CGO_ENABLED: "1"
        run: |
          node scripts/go.mjs vet ./...
          node scripts/go.mjs test -race ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Production build and installer syntax
        run: |
          npm run build
          npm run check --prefix landing
          npm run build --prefix landing
          npm run build --prefix cli
          bash -n install.sh

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      # The runner image already carries the Chromium system libraries. Skip the
      # optional apt font set so a mirror outage cannot fail the tests.
      - run: npx playwright install chromium
      - run: npm run test:e2e

  integration:
    name: integration (${{ matrix.suite }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [deploy, data, access]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run real Docker acceptance
        shell: bash
        run: |
          case '${{ matrix.suite }}' in
            deploy) export SHIPPER_TEST_DOCKER=1 SHIPPER_TEST_FULL=1 SHIPPER_TEST_COMPOSE=1 SHIPPER_TEST_TASKS=1 SHIPPER_TEST_SOURCES=1 ;;
            data) export SHIPPER_TEST_BACKUPS=1 SHIPPER_TEST_DATABASE=1 SHIPPER_TEST_DATABASE_RESOURCES=1 ;;
            access) export SHIPPER_TEST_NETWORKING=1 SHIPPER_TEST_TERMINAL=1 ;;
          esac
          node scripts/go.mjs generate ./internal/startup
          go test -count=1 -timeout=45m ./internal/deploy ./internal/httpapi

  image:
    name: image
    needs: [verify, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful acceptance jobs
        run: test '${{ needs.verify.result }}' = success && test '${{ needs.integration.result }}' = success
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shipper:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the packaged image
        run: test "$(docker run --rm --network none shipper:ci version)" = "0.0.0-ci"
