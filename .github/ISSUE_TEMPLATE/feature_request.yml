name: Feature request
description: Suggest something ShipperKit should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposal
      description: How you'd like it to work.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do today instead, if anything.
